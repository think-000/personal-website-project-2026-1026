
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人网站</title>
    <style>
        body {
            margin: 0;
            font-family: "Microsoft YaHei", sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        main {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        section {
            background: white;
            margin-bottom: 24px;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 4px 16px #0000000d;
        }

        .welcome {
            text-align: center;
            padding: 50px 25px;
        }

        .welcome h2 {
            color: #2563eb;
            font-size: 32px;
        }

        .project {
            border-left: 5px solid #3b82f6;
            padding-left: 18px;
            margin-top: 20px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <header>
        <h1>我的个人网站</h1>
        <p>记录学习、编程与科学探索</p>
    </header>

    <main>
        <section class="welcome">
            <h2>你好，欢迎来到我的网站！</h2>
            <p>这是我制作的第一个个人网页。</p>
        </section>

        <section>
            <h2>关于我</h2>
            <p>我正在学习 Python、人工智能、物理仿真和网页开发。</p>
        </section>

        <section>
            <h2>我的项目</h2>

            <div class="project">
                <h3>小球追踪</h3>
                <p>使用 Python 分析小球的运动轨迹。</p>
            </div>

            <div class="project">
                <h3>Y 型摆仿真</h3>
                <p>使用物理模型研究振动和动力学。</p>
            </div>
        </section>
    </main>

    <footer>
        © 2026 我的个人网站
    </footer>
</body>
</html>
